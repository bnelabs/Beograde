# Beograde — nginx site config for a Hetzner VPS.
#
# Assumes you've placed the built artefact at /var/www/beograde
# (i.e. `dist/app/browser/` from `npm run build`). Get certs with certbot.
#
# Place at: /etc/nginx/sites-available/beograde
# Then:    ln -s ../sites-available/beograde /etc/nginx/sites-enabled/beograde
#          nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name beograde.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name beograde.example.com;

    ssl_certificate     /etc/letsencrypt/live/beograde.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beograde.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/beograde;
    index index.html;

    # Don't keep the SW or its config around — must always be fresh.
    location = /ngsw-worker.js     { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /ngsw.json          { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /safety-worker.js   { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /worker-basic.min.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html         { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # PMTiles — must serve byte ranges, must never be modified mid-flight.
    location /assets/tiles/ {
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=2592000, immutable";
        types { } default_type application/octet-stream;
        gzip off;
        try_files $uri =404;
    }

    # Hashed JS/CSS bundles can be cached forever.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|webp|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Other static assets.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bigger uploads not expected; keep the request body small.
    client_max_body_size 1m;

    # Compress text responses (the pmtiles location explicitly opts out).
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
