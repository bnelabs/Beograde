<div class="fixed inset-0 flex flex-col bg-[#F5F2ED]">
  <!-- Main view fills above the bottom nav -->
  <main class="flex-1 overflow-y-auto overscroll-contain relative">
    <router-outlet></router-outlet>
  </main>

  <!-- iOS install hint -->
  @if (showIosInstallTip()) {
    <div class="absolute bottom-20 left-3 right-3 z-40 bg-ink text-white rounded-2xl shadow-2xl p-4 flex items-start gap-3">
      <span class="material-symbols-outlined text-primary shrink-0">ios_share</span>
      <div class="flex-1 text-xs leading-relaxed">
        <strong>Install Beograde:</strong> tap Share, then <em>Add to Home Screen</em>.
        It works fully offline once added.
      </div>
      <button
        type="button"
        (click)="dismissedInstallTip.set(true)"
        aria-label="Dismiss"
        class="shrink-0 -mr-1 -mt-1 w-7 h-7 rounded-full flex items-center justify-center text-white/60 active:text-white">
        <span class="material-symbols-outlined" style="font-size: 18px;">close</span>
      </button>
    </div>
  }

  <!-- Bottom nav -->
  <nav class="shrink-0 bg-white border-t border-ink/5 pb-[env(safe-area-inset-bottom)]">
    <ul class="grid grid-cols-4">
      @for (tab of tabs; track tab.id) {
        <li>
          <a
            [routerLink]="tab.route"
            [attr.aria-current]="activeTab() === tab.id ? 'page' : null"
            class="flex flex-col items-center justify-center py-3 gap-0.5 transition"
            [class.text-primary]="activeTab() === tab.id"
            [class.text-ink/50]="activeTab() !== tab.id">
            <span class="material-symbols-outlined" style="font-size: 22px;">{{ tab.icon }}</span>
            <span class="text-[10px] font-medium tracking-wide uppercase">{{ tab.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</div>
